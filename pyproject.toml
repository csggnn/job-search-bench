[project]
name = "job-search-bench"
version = "0.1.0"
description = "Champion-vs-candidate evaluation of the Claude Code dev setup used on job-search-agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bench = "bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bench"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = [
    "PLR09",   # size and complexity limits
    "PLR2004", # magic-value-comparison
]

[tool.ruff.lint.isort]
combine-as-imports = true
