name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"

      - name: Install the locked environment
        run: uv sync --locked

      - name: Run ruff check
        run: uv run ruff check --output-format github .

      - name: Run ruff format check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: uv run python -m unittest discover -s tests -t .

      - name: Install OpenSpec
        if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate OpenSpec changes and specs
        if: ${{ !cancelled() }}
        run: npx openspec validate --all --no-interactive

      - name: Check generated OpenSpec files match the pinned version
        if: ${{ !cancelled() }}
        run: |
          npx openspec update --force > /dev/null
          git diff --exit-code -- .claude
