# Repository under evaluation. Arm clones are made from it.
[target]
repo = "git@github.com:csggnn/job-search-agent.git"
# Branch the snapshot tag belongs to. Each arm has it as a local branch at the tag.
default_branch = "master"

# The Claude Code plugin under evaluation. Each arm loads it at the arm's commit.
[setup]
repo = "https://github.com/csggnn/simplicity-rules.git"

# User-level Claude Code files copied into every arm's config dir, identical for both arms.
# Only files that shape how an arm writes code. Personal workflow skills and commands are
# left out, so changing them keeps user_config_sha256.
# Paths are relative to source. settings_keys are the keys taken from source/settings.json.
[user_config]
source = "~/.claude"
paths = ["CLAUDE.md", "hooks"]
settings_keys = ["hooks"]

# The judge runs on a different model than the arms.
[models]
arm = "claude-opus-5-5"
judge = "claude-sonnet-5-5"
